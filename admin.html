<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة StoreRi7a</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f8fc;font-family:Arial,Tahoma,sans-serif;color:#172033}
.wrap{max-width:950px;margin:auto;padding:18px}
h1{color:#16489d}
.card{background:#fff;border:1px solid #dfe6f2;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 8px 25px #163a7210}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;color:#667085;margin:4px 0}
input,select,textarea{width:100%;border:1px solid #d6dfed;border-radius:12px;padding:0 12px;font-size:15px;background:#fff}
input,select{height:46px}
textarea{min-height:120px;padding:12px;resize:vertical;font-family:inherit}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
.primary{background:#174ea6;color:#fff}
.secondary{background:#eef3fb;color:#17427d}
.danger{background:#ffebef;color:#b10032}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.msg{padding:10px;border-radius:10px;margin-top:10px;display:none}
.ok{background:#e8fff0;color:#08752f;display:block}
.err{background:#ffecee;color:#a60021;display:block}
.typeSwitch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.typeSwitch button.active{background:#174ea6;color:#fff}

.multiUploadBox{
  border:2px dashed #c8d7ee;
  border-radius:16px;
  padding:18px;
  background:#fbfdff;
}
.multiUploadTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.multiUploadTop strong{color:#174ea6}
.hint{font-size:12px;color:#7b8798;margin-top:6px}
.galleryPreview{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:14px;
}
.galleryItem{
  position:relative;
  border:1px solid #dce5f1;
  border-radius:14px;
  overflow:hidden;
  background:#fff;
  min-height:150px;
  padding-bottom:42px;
}
.galleryItem.main{
  outline:3px solid #1764d8;
}
.galleryItem img{
  width:100%;
  height:150px;
  object-fit:cover;
  display:block;
}
.galleryTools{
  position:absolute;
  inset:auto 0 0 0;
  display:flex;
  gap:4px;
  justify-content:center;
  padding:6px;
  background:#fff;
}
.galleryTools button{
  padding:6px 8px;
  font-size:11px;
  border-radius:8px;
}
.mainTag{
  position:absolute;
  top:6px;
  right:6px;
  background:#1764d8;
  color:#fff;
  border-radius:999px;
  padding:4px 8px;
  font-size:10px;
  font-weight:700;
}
.removeBtn{
  position:absolute;
  top:6px;
  left:6px;
  width:28px;
  height:28px;
  border-radius:50%;
  padding:0;
  background:#fff0f0;
  color:#b10032;
  z-index:2;
}
.uploadStatus{font-size:13px;color:#667085;margin-top:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;border-top:1px solid #eee;padding:14px 0}
.item:first-child{border-top:0}
.meta{font-size:13px;color:#7a8494;margin-top:5px;line-height:1.6}
.sale{color:#d71920;font-weight:800}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .item{grid-template-columns:1fr}
  .galleryPreview{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
<h1>لوحة إدارة StoreRi7a</h1>

<div class="card">
  <h3>مفتاح الإدارة</h3>
  <label>ADMIN_KEY</label>
  <input id="adminKey" type="password" placeholder="ADMIN_KEY">
  <div class="actions">
    <button class="secondary" onclick="saveKey()">حفظ المفتاح</button>
    <button class="secondary" onclick="loadProducts()">تحديث المنتجات</button>
  </div>
</div>

<div class="card">
  <h3 id="formTitle">إضافة منتج</h3>

  <div class="typeSwitch">
    <button id="normalBtn" class="secondary active" type="button" onclick="setProductType(false)">منتج بدون تخفيض</button>
    <button id="saleBtn" class="secondary" type="button" onclick="setProductType(true)">منتج بتخفيض</button>
  </div>

  <div class="grid">
    <div><label>اسم المنتج</label><input id="productName" placeholder="مثال: Rose Velvet"></div>
    <div><label>القسم</label><select id="productCategory"><option>عطور نسائية</option><option>عطور رجالية</option><option>مواد التجميل</option></select></div>
    <div><label>الماركة</label><input id="productBrand" placeholder="مثال: Lattafa"></div>
    <div><label>الحجم / السعة</label><input id="productSize" placeholder="مثال: 120 ml"></div>
    <div><label>السعر العادي (DH)</label><input id="productPrice" type="number" min="0" step="0.01"></div>
    <div id="salePriceWrap" style="display:none"><label>سعر التخفيض</label><input id="productSalePrice" type="number" min="0" step="0.01" oninput="syncDiscount()"></div>
    <div id="discountWrap" style="display:none"><label>نسبة التخفيض %</label><input id="productDiscount" type="number" min="0" max="100" oninput="syncSalePrice()"></div>

    <div class="full">
      <label>وصف المنتج</label>
      <textarea id="productDescription"></textarea>
    </div>

    <div class="full">
      <label>صور المنتج</label>
      <div class="multiUploadBox">
        <div class="multiUploadTop">
          <div>
            <strong>يمكنك إضافة عدة صور للمنتج</strong>
            <div class="hint">حتى 12 صورة — JPEG / PNG / WebP — الحد الأقصى 5MB لكل صورة</div>
          </div>
          <label class="primary" style="display:inline-flex;align-items:center;gap:7px;cursor:pointer;padding:12px 16px;border-radius:12px">
            📷 اختر عدة صور
            <input id="productImageFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="previewNewFiles()" style="display:none">
          </label>
        </div>

        <div id="galleryPreview" class="galleryPreview"></div>
        <div class="uploadStatus" id="uploadStatus">الصورة الأولى ستكون رئيسية، ويمكنك تغيير الصورة الرئيسية من الأسفل.</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="saveBtn" onclick="saveProduct()">إضافة المنتج</button>
    <button class="secondary" id="cancelBtn" onclick="resetForm()" style="display:none">إلغاء التعديل</button>
  </div>

  <div id="message" class="msg"></div>
</div>

<div class="card">
  <h3>المنتجات الحالية</h3>
  <div id="productList">جاري التحميل...</div>
</div>
</div>

<script>
let editingId=null;
let products=[];
let saleMode=false;
let galleryUrls=[];
let pendingFiles=[];
let mainImageIndex=0;

const $=id=>document.getElementById(id);

function key(){
  return localStorage.getItem('storeri7a_admin_key')||$('adminKey').value.trim();
}

function saveKey(){
  localStorage.setItem('storeri7a_admin_key',$('adminKey').value.trim());
  show('✅ تم حفظ المفتاح','ok');
  loadProducts();
}

function show(text,type='ok'){
  const m=$('message');
  m.textContent=text;
  m.className='msg '+type;
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function parseImages(v){
  if(Array.isArray(v)) return v.filter(Boolean);
  if(typeof v==='string'&&v.trim()){
    try{
      const a=JSON.parse(v);
      if(Array.isArray(a)) return a.filter(Boolean);
    }catch(e){}
  }
  return [];
}

function setProductType(s){
  saleMode=!!s;
  $('normalBtn').classList.toggle('active',!saleMode);
  $('saleBtn').classList.toggle('active',saleMode);
  $('salePriceWrap').style.display=saleMode?'block':'none';
  $('discountWrap').style.display=saleMode?'block':'none';
  if(!saleMode){
    $('productSalePrice').value='';
    $('productDiscount').value='';
  }
}

function syncDiscount(){
  const p=Number($('productPrice').value||0);
  const s=Number($('productSalePrice').value||0);
  if(p>0&&s>0&&s<p){
    $('productDiscount').value=Math.round((1-s/p)*100);
  }
}

function syncSalePrice(){
  const p=Number($('productPrice').value||0);
  const d=Number($('productDiscount').value||0);
  if(p>0&&d>0&&d<100){
    $('productSalePrice').value=(p*(1-d/100)).toFixed(2).replace(/\.00$/,'');
  }
}

function previewNewFiles(){
  const incoming=Array.from($('productImageFiles').files||[]);
  const free=Math.max(0,12-(galleryUrls.length+pendingFiles.length));
  pendingFiles=[...pendingFiles,...incoming.slice(0,free)];
  $('productImageFiles').value='';
  renderGalleryPreview();
}

function allPreviewItems(){
  return [
    ...galleryUrls.map((url,i)=>({type:'url',value:url,index:i})),
    ...pendingFiles.map((file,i)=>({type:'file',value:file,index:i}))
  ];
}

function renderGalleryPreview(){
  const items=allPreviewItems();

  if(!items.length){
    $('galleryPreview').innerHTML='<div class="hint">لا توجد صور بعد.</div>';
    mainImageIndex=0;
    return;
  }

  if(mainImageIndex>=items.length) mainImageIndex=0;

  $('galleryPreview').innerHTML=items.map((item,i)=>{
    const src=item.type==='url' ? item.value : URL.createObjectURL(item.value);
    return `
      <div class="galleryItem ${i===mainImageIndex?'main':''}">
        ${i===mainImageIndex?'<span class="mainTag">رئيسية</span>':''}
        <button class="removeBtn" type="button" onclick="removeImageAt(${i})">✕</button>
        <img src="${esc(src)}">
        <div class="galleryTools">
          <button class="secondary" type="button" onclick="setMainImage(${i})">${i===mainImageIndex?'✓ الرئيسية':'تعيين كرئيسية'}</button>
          ${i>0?`<button class="secondary" type="button" onclick="moveImage(${i},-1)">→</button>`:''}
          ${i<items.length-1?`<button class="secondary" type="button" onclick="moveImage(${i},1)">←</button>`:''}
        </div>
      </div>
    `;
  }).join('');
}

function removeImageAt(globalIndex){
  const urlCount=galleryUrls.length;
  if(globalIndex<urlCount){
    galleryUrls.splice(globalIndex,1);
  }else{
    pendingFiles.splice(globalIndex-urlCount,1);
  }
  if(mainImageIndex===globalIndex) mainImageIndex=0;
  if(mainImageIndex>globalIndex) mainImageIndex--;
  renderGalleryPreview();
}

function setMainImage(index){
  mainImageIndex=index;
  renderGalleryPreview();
}

function moveImage(index,delta){
  const items=allPreviewItems();
  const target=index+delta;
  if(target<0||target>=items.length)return;

  [items[index],items[target]]=[items[target],items[index]];

  galleryUrls=items.filter(x=>x.type==='url').map(x=>x.value);
  pendingFiles=items.filter(x=>x.type==='file').map(x=>x.value);

  if(mainImageIndex===index) mainImageIndex=target;
  else if(mainImageIndex===target) mainImageIndex=index;

  renderGalleryPreview();
}

async function uploadOne(file){
  const form=new FormData();
  form.append('image',file);

  const r=await fetch('/api/upload-image',{
    method:'POST',
    headers:{'x-admin-key':key()},
    body:form
  });

  const text=await r.text();
  if(!r.ok) throw new Error(text||('HTTP '+r.status));

  const data=JSON.parse(text);
  if(!data.url) throw new Error('لم يتم إرجاع رابط الصورة');

  return data.url;
}

async function uploadPendingImages(){
  if(!pendingFiles.length) return;

  const originalItems=allPreviewItems();
  const uploadedMap=new Map();
  let uploadedCount=0;
  const total=pendingFiles.length;

  for(let i=0;i<pendingFiles.length;i++){
    $('uploadStatus').textContent=`جاري رفع الصورة ${i+1} من ${total}...`;
    const file=pendingFiles[i];
    const url=await uploadOne(file);
    uploadedMap.set(file,url);
    uploadedCount++;
  }

  const finalItems=originalItems.map(item=>{
    if(item.type==='url') return item.value;
    return uploadedMap.get(item.value);
  }).filter(Boolean);

  galleryUrls=finalItems;
  pendingFiles=[];
  $('uploadStatus').textContent=`✅ تم رفع ${uploadedCount} صورة بنجاح`;
  renderGalleryPreview();
}

async function loadProducts(){
  $('adminKey').value=localStorage.getItem('storeri7a_admin_key')||'';

  try{
    const r=await fetch('/api/products?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);

    products=await r.json();
    renderProducts();
  }catch(e){
    $('productList').textContent='تعذر تحميل المنتجات: '+e.message;
  }
}

function renderProducts(){
  if(!products.length){
    $('productList').innerHTML='<p>لا توجد منتجات بعد.</p>';
    return;
  }

  $('productList').innerHTML=products.map(p=>{
    const imgs=parseImages(p.images);
    const count=imgs.length||(p.image?1:0);

    const sale=(p.sale_price!=null&&Number(p.sale_price)<Number(p.price))
      ? `<span class="sale"> → ${p.sale_price} DH (-${p.discount||Math.round((1-p.sale_price/p.price)*100)}%)</span>`
      : '';

    return `<div class="item">
      <div>
        <b>${esc(p.name)}</b>
        <div class="meta">${esc(p.category)} — ${p.price} DH ${sale}</div>
        <div class="meta">${p.brand?'الماركة: '+esc(p.brand)+' — ':''}${p.size?'الحجم: '+esc(p.size):''}</div>
        <div class="meta">📷 ${count} صورة</div>
      </div>

      <div class="actions">
        <button class="secondary" onclick="editProduct(${Number(p.id)})">تعديل</button>
        <button class="danger" onclick="deleteProduct(${Number(p.id)})">حذف</button>
      </div>
    </div>`;
  }).join('');
}

function editProduct(id){
  const p=products.find(x=>Number(x.id)===Number(id));
  if(!p)return;

  editingId=id;
  $('formTitle').textContent='تعديل المنتج';
  $('saveBtn').textContent='حفظ التعديل';
  $('cancelBtn').style.display='inline-block';

  $('productName').value=p.name||'';
  $('productCategory').value=p.category==='تجميل'?'مواد التجميل':(p.category||'عطور نسائية');
  $('productBrand').value=p.brand||'';
  $('productSize').value=p.size||'';
  $('productDescription').value=p.description||'';
  $('productPrice').value=p.price??'';
  $('productSalePrice').value=p.sale_price??'';
  $('productDiscount').value=p.discount??'';

  setProductType(p.sale_price!=null&&Number(p.sale_price)<Number(p.price));

  galleryUrls=parseImages(p.images);
  if(!galleryUrls.length&&p.image) galleryUrls=[p.image];

  pendingFiles=[];
  mainImageIndex=0;

  if(p.image){
    const idx=galleryUrls.indexOf(p.image);
    if(idx>=0) mainImageIndex=idx;
  }

  renderGalleryPreview();
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
  editingId=null;

  $('formTitle').textContent='إضافة منتج';
  $('saveBtn').textContent='إضافة المنتج';
  $('cancelBtn').style.display='none';

  ['productName','productBrand','productSize','productDescription','productPrice','productSalePrice','productDiscount'].forEach(id=>$(id).value='');

  $('productCategory').value='عطور نسائية';
  galleryUrls=[];
  pendingFiles=[];
  mainImageIndex=0;
  renderGalleryPreview();
  setProductType(false);
}

async function saveProduct(){
  try{
    await uploadPendingImages();

    if(mainImageIndex>0 && galleryUrls[mainImageIndex]){
      const chosen=galleryUrls[mainImageIndex];
      galleryUrls.splice(mainImageIndex,1);
      galleryUrls.unshift(chosen);
      mainImageIndex=0;
    }

    const payload={
      name:$('productName').value.trim(),
      category:$('productCategory').value,
      brand:$('productBrand').value.trim(),
      size:$('productSize').value.trim(),
      description:$('productDescription').value.trim(),
      price:Number($('productPrice').value),
      sale_price:saleMode&&$('productSalePrice').value!==''?Number($('productSalePrice').value):null,
      discount:saleMode&&$('productDiscount').value!==''?Number($('productDiscount').value):0,
      image:galleryUrls[0]||'',
      images:galleryUrls,
      active:1
    };

    if(!payload.name||!payload.category||!Number.isFinite(payload.price)||payload.price<0){
      show('❌ أدخل الاسم والقسم والسعر','err');
      return;
    }

    if(payload.sale_price!==null&&(payload.sale_price<0||payload.sale_price>=payload.price)){
      show('❌ سعر التخفيض يجب أن يكون أقل من السعر العادي','err');
      return;
    }

    const r=await fetch(editingId?'/api/products/'+editingId:'/api/products',{
      method:editingId?'PUT':'POST',
      headers:{
        'content-type':'application/json',
        'x-admin-key':key()
      },
      body:JSON.stringify(payload)
    });

    const text=await r.text();
    if(!r.ok) throw new Error(text||('HTTP '+r.status));

    show(editingId?'✅ تم حفظ التعديلات بنجاح':'✅ تمت إضافة المنتج بنجاح','ok');
    resetForm();
    await loadProducts();

  }catch(e){
    show('❌ '+e.message,'err');
  }
}

async function deleteProduct(id){
  if(!confirm('هل تريد حذف هذا المنتج؟')) return;

  try{
    const r=await fetch('/api/products/'+id,{
      method:'DELETE',
      headers:{'x-admin-key':key()}
    });

    const text=await r.text();
    if(!r.ok) throw new Error(text||('HTTP '+r.status));

    show('✅ تم حذف المنتج','ok');
    await loadProducts();
  }catch(e){
    show('❌ '+e.message,'err');
  }
}

setProductType(false);
loadProducts();
</script>
</body>
</html>
