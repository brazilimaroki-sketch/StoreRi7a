<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة StoreRi7a</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7fb;font-family:Arial,Tahoma,sans-serif;color:#17213a}.wrap{max-width:950px;margin:auto;padding:18px}h1{color:#173f8a}.card{background:#fff;border:1px solid #e4e6f0;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 8px 25px #0d2d6b10}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:block;font-size:13px;color:#667085;margin:4px 0}input,select{width:100%;height:46px;border:1px solid #d8dceb;border-radius:12px;padding:0 12px;font-size:15px;background:#fff}input[type=file]{height:auto;padding:12px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#173f8a;color:#fff}.secondary{background:#edf2ff;color:#173f8a}.danger{background:#ffe9ec;color:#bd1237}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{padding:10px;border-radius:10px;margin-top:10px;display:none}.ok{background:#e8fff0;color:#08752f;display:block}.err{background:#ffecee;color:#a60021;display:block}.item{display:grid;grid-template-columns:1fr auto;gap:10px;border-top:1px solid #eee;padding:14px 0}.item:first-child{border-top:0}.meta{font-size:13px;color:#7a6570;margin-top:5px}.sale{color:#d71920;font-weight:800}small.hint{display:block;color:#8d727c;margin-top:5px}.typeSwitch{display:grid;grid-template-columns:1fr 1fr;gap:8px}.typeBtn{background:#f4f5fb;color:#344054;border:1px solid #d9ddea}.typeBtn.active{background:#173f8a;color:#fff;border-color:#173f8a}.previewBox{display:none;margin-top:10px;border:1px solid #ddd;border-radius:14px;padding:10px;background:#fafafa}.previewBox img{max-width:180px;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;display:block}.uploadStatus{font-size:13px;margin-top:7px;color:#475467}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>لوحة إدارة StoreRi7a</h1>
<div class="card"><h3>مفتاح الإدارة</h3><label>ADMIN_KEY</label><input id="adminKey" type="password" placeholder="أدخل نفس ADMIN_KEY الموجود في Cloudflare"><div class="actions"><button class="secondary" onclick="saveKey()">حفظ المفتاح</button><button class="secondary" onclick="loadProducts()">تحديث المنتجات</button></div></div>
<div class="card">
<h3 id="formTitle">إضافة منتج</h3>
<label>نوع المنتج</label>
<div class="typeSwitch"><button type="button" id="normalBtn" class="typeBtn active" onclick="setSaleMode(false)">منتوج بدون تخفيض</button><button type="button" id="saleBtn" class="typeBtn" onclick="setSaleMode(true)">منتوج بتخفيض</button></div>
<div class="grid" style="margin-top:12px">
<div><label>اسم المنتج</label><input id="productName" placeholder="مثال: Rose Velvet"></div>
<div><label>القسم</label><select id="productCategory"><option value="عطور نسائية">عطور نسائية</option><option value="عطور رجالية">عطور رجالية</option><option value="مواد التجميل">مواد التجميل</option></select></div>
<div><label>السعر العادي (DH)</label><input id="productPrice" type="number" min="0" step="0.01" placeholder="199" oninput="if(saleMode)syncSalePrice()"></div>
<div id="salePriceWrap" style="display:none"><label>سعر التخفيض (DH)</label><input id="productSalePrice" type="number" min="0" step="0.01" placeholder="149" oninput="syncDiscount()"></div>
<div id="discountWrap" style="display:none"><label>نسبة التخفيض %</label><input id="productDiscount" type="number" min="1" max="99" step="1" placeholder="25" oninput="syncSalePrice()"></div>
<div><label>صورة المنتج من الهاتف أو الحاسوب</label><input id="productImageFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewImage()"><small class="hint">JPEG / PNG / WebP — الحد الأقصى 5 MB.</small><div id="previewBox" class="previewBox"><img id="imagePreview" alt="معاينة صورة المنتج"><div id="uploadStatus" class="uploadStatus"></div></div></div>
</div>
<input id="existingImage" type="hidden">
<div class="actions"><button class="primary" id="saveBtn" onclick="saveProduct()">إضافة المنتج</button><button class="secondary" id="cancelBtn" onclick="resetForm()" style="display:none">إلغاء التعديل</button></div><div id="message" class="msg"></div>
</div>
<div class="card"><h3>المنتجات الحالية</h3><div id="productList">جاري التحميل...</div></div>
</div>
<script>
let editingId=null,products=[],saleMode=false;const $=id=>document.getElementById(id);
function key(){return localStorage.getItem('storeri7a_admin_key')||$('adminKey').value.trim()}
function saveKey(){localStorage.setItem('storeri7a_admin_key',$('adminKey').value.trim());show('✅ تم حفظ المفتاح','ok');loadProducts()}
function show(text,type='ok'){const m=$('message');m.textContent=text;m.className='msg '+type}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setSaleMode(enabled){saleMode=enabled;$('normalBtn').classList.toggle('active',!enabled);$('saleBtn').classList.toggle('active',enabled);$('salePriceWrap').style.display=enabled?'block':'none';$('discountWrap').style.display=enabled?'block':'none';if(!enabled){$('productSalePrice').value='';$('productDiscount').value=''}}
function syncDiscount(){const price=Number($('productPrice').value||0),sale=Number($('productSalePrice').value||0);if(price>0&&sale>0&&sale<price)$('productDiscount').value=Math.round((1-sale/price)*100)}
function syncSalePrice(){if(!saleMode)return;const price=Number($('productPrice').value||0),disc=Number($('productDiscount').value||0);if(price>0&&disc>0&&disc<100)$('productSalePrice').value=(price*(1-disc/100)).toFixed(2).replace(/\.00$/,'')}
function previewImage(){const file=$('productImageFile').files[0];if(!file)return;if(file.size>5*1024*1024){$('productImageFile').value='';show('❌ حجم الصورة أكبر من 5 MB','err');return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){$('productImageFile').value='';show('❌ استعمل صورة JPEG أو PNG أو WebP','err');return}$('imagePreview').src=URL.createObjectURL(file);$('previewBox').style.display='block';$('uploadStatus').textContent='الصورة جاهزة للرفع عند حفظ المنتج.'}
async function uploadSelectedImage(){const file=$('productImageFile').files[0];if(!file)return $('existingImage').value||'';$('uploadStatus').textContent='جاري رفع الصورة...';const form=new FormData();form.append('image',file);const r=await fetch('/api/upload-image',{method:'POST',headers:{'x-admin-key':key()},body:form});const text=await r.text();if(!r.ok)throw new Error(text||('HTTP '+r.status));const data=JSON.parse(text);if(!data.url)throw new Error('لم يرجع السيرفر رابط الصورة');$('uploadStatus').textContent='✅ تم رفع الصورة.';return data.url}
async function loadProducts(){$('adminKey').value=localStorage.getItem('storeri7a_admin_key')||'';try{const r=await fetch('/api/products?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);products=await r.json();renderProducts()}catch(e){$('productList').textContent='تعذر تحميل المنتجات: '+e.message}}
function renderProducts(){if(!products.length){$('productList').innerHTML='<p>لا توجد منتجات بعد.</p>';return}$('productList').innerHTML=products.map(p=>{const hasSale=p.sale_price!==null&&p.sale_price!==undefined&&Number(p.sale_price)<Number(p.price);const sale=hasSale?`<span class="sale"> → ${p.sale_price} DH (-${p.discount||Math.round((1-p.sale_price/p.price)*100)}%)</span>`:'<span> — بدون تخفيض</span>';return `<div class="item"><div><b>${esc(p.name)}</b><div class="meta">${esc(p.category)} — ${p.price} DH ${sale}</div><div class="meta">${p.image?'✅ عنده صورة':'بدون صورة'}</div></div><div class="actions"><button class="secondary" onclick="editProduct(${Number(p.id)})">تعديل</button><button class="danger" onclick="deleteProduct(${Number(p.id)})">حذف</button></div></div>`}).join('')}
function editProduct(id){const p=products.find(x=>Number(x.id)===Number(id));if(!p)return;editingId=id;$('formTitle').textContent='تعديل المنتج';$('saveBtn').textContent='حفظ التعديل';$('cancelBtn').style.display='inline-block';$('productName').value=p.name||'';$('productCategory').value=p.category==='تجميل'?'مواد التجميل':(p.category||'عطور نسائية');$('productPrice').value=p.price??'';$('existingImage').value=p.image||'';$('productImageFile').value='';const hasSale=p.sale_price!==null&&p.sale_price!==undefined&&Number(p.sale_price)<Number(p.price);setSaleMode(hasSale);if(hasSale){$('productSalePrice').value=p.sale_price??'';$('productDiscount').value=p.discount??''}if(p.image){$('imagePreview').src=p.image;$('previewBox').style.display='block';$('uploadStatus').textContent='الصورة الحالية. اختر صورة جديدة فقط إذا أردت تغييرها.'}else $('previewBox').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
function resetForm(){editingId=null;saleMode=false;$('formTitle').textContent='إضافة منتج';$('saveBtn').textContent='إضافة المنتج';$('cancelBtn').style.display='none';$('productName').value='';$('productPrice').value='';$('productSalePrice').value='';$('productDiscount').value='';$('productCategory').value='عطور نسائية';$('productImageFile').value='';$('existingImage').value='';$('previewBox').style.display='none';$('imagePreview').src='';$('uploadStatus').textContent='';setSaleMode(false)}
async function saveProduct(){const btn=$('saveBtn');btn.disabled=true;btn.textContent='جاري الحفظ...';try{const imageUrl=await uploadSelectedImage();const payload={name:$('productName').value.trim(),category:$('productCategory').value,price:Number($('productPrice').value),sale_price:saleMode?Number($('productSalePrice').value):null,discount:saleMode?Number($('productDiscount').value||0):0,image:imageUrl,active:1};if(!payload.name||!payload.category||!Number.isFinite(payload.price)||payload.price<0)throw new Error('أدخل الاسم والقسم والسعر بشكل صحيح');if(saleMode){if(!Number.isFinite(payload.sale_price)||payload.sale_price<0||payload.sale_price>=payload.price)throw new Error('سعر التخفيض يجب أن يكون أقل من السعر العادي');if(!Number.isFinite(payload.discount)||payload.discount<=0||payload.discount>=100)throw new Error('نسبة التخفيض يجب أن تكون بين 1 و99')}const url=editingId?'/api/products/'+editingId:'/api/products',method=editingId?'PUT':'POST';const r=await fetch(url,{method,headers:{'content-type':'application/json','x-admin-key':key()},body:JSON.stringify(payload)});const text=await r.text();if(!r.ok)throw new Error(text||('HTTP '+r.status));show(editingId?'✅ تم تعديل المنتج بنجاح':'✅ تمت إضافة المنتج بنجاح','ok');resetForm();await loadProducts()}catch(e){show('❌ '+e.message,'err')}finally{btn.disabled=false;btn.textContent=editingId?'حفظ التعديل':'إضافة المنتج'}}
async function deleteProduct(id){if(!confirm('هل تريد حذف هذا المنتج؟'))return;try{const r=await fetch('/api/products/'+id,{method:'DELETE',headers:{'x-admin-key':key()}});const text=await r.text();if(!r.ok)throw new Error(text||('HTTP '+r.status));show('✅ تم حذف المنتج','ok');await loadProducts()}catch(e){show('❌ '+e.message,'err')}}
loadProducts();
</script>
</body>
</html>
