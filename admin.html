<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>StoreRi7a Admin</title>
<style>body{font-family:Arial;background:#f6f2f2;margin:0;padding:20px;color:#211c20}.wrap{max-width:850px;margin:auto}.box{background:white;padding:20px;border-radius:12px;margin:15px 0}input,select,button{padding:12px;margin:5px;border:1px solid #ddd;border-radius:7px}button{background:#211c20;color:white;cursor:pointer}.danger{background:#9b2c2c}.row{display:flex;flex-wrap:wrap;gap:7px}.row>*{flex:1}.product{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:12px 0;gap:10px}</style></head>
<body><div class="wrap"><h1>لوحة StoreRi7a</h1><div class="box"><h3>مفتاح الإدارة</h3><input id="key" type="password" placeholder="ADMIN_KEY"><button onclick="saveKey()">حفظ على هذا الجهاز</button></div>
<div class="box"><h3>إضافة منتج</h3><div class="row"><input id="name" placeholder="اسم المنتج"><select id="cat"><option>عطور نسائية</option><option>عطور رجالية</option><option>تجميل</option></select><input id="price" type="number" placeholder="الثمن"><input id="image" placeholder="رابط الصورة أو Emoji"></div><button onclick="add()">إضافة المنتج</button></div>
<div class="box"><h3>المنتجات</h3><div id="list">تحميل...</div></div></div>
<script>
key.value=localStorage.adminKey||''; function saveKey(){localStorage.adminKey=key.value;alert('تم الحفظ')}
async function load(){let r=await fetch('/api/products');let a=await r.json();list.innerHTML=a.map(p=>`<div class="product"><span>${p.image||'📦'} <b>${p.name}</b> — ${p.price} DH</span><button class="danger" onclick="del(${p.id})">حذف</button></div>`).join('')||'لا توجد منتجات'}
async function add(){let r=await fetch('/api/products',{method:'POST',headers:{'content-type':'application/json','x-admin-key':key.value},body:JSON.stringify({name:name.value,category:cat.value,price:+price.value,image:image.value})});if(r.ok){name.value=price.value=image.value='';load()}else alert('تحقق من مفتاح الإدارة والبيانات')}
async function del(id){if(!confirm('حذف المنتج؟'))return;let r=await fetch('/api/products/'+id,{method:'DELETE',headers:{'x-admin-key':key.value}});if(r.ok)load();else alert('غير مصرح')}
load();
</script></body></html>
