<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3ea8">
<title>StoreRi7a</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="siteHeader">
  <div class="topBar">

    <a class="brandLogo" href="#top" aria-label="StoreRi7a">
      <img src="ri7a-logo.png" alt="RI7A">
    </a>

    <div class="searchBox">
      <span>⌕</span>
      <input
        id="searchTop"
        type="search"
        placeholder="ابحث عن منتج..."
        oninput="searchAll(this.value)"
      >
    </div>

    <button
      class="cartTop"
      type="button"
      onclick="openCart()"
      aria-label="السلة"
    >
      🛒
      <b id="cartCount">0</b>
    </button>

  </div>

  <nav class="mainNav" aria-label="الأقسام الرئيسية">
    <a class="active" href="#top">⌂ الرئيسية</a>
    <a href="#women">♀ عطور نسائية</a>
    <a href="#men">♂ عطور رجالية</a>
    <a href="#beauty">▣ مواد التجميل</a>
  </nav>
</header>


<main id="top" class="page">

  <section class="hero" aria-label="Store Ri7a">
    <img
      src="hero-ri7a.png"
      alt="Store RI7A - عطور ومنتجات للرجال والنساء"
    >
  </section>


  <section class="section firstSection" id="discounts">

    <div class="sectionTitle">
      <div>
        <span class="eyebrow">SPECIAL OFFERS</span>
        <h2>🔥 منتجات مخفضة</h2>
        <p>أفضل العروض على عطور ومنتجات مختارة</p>
      </div>

      <a href="#discounts">عرض الكل</a>
    </div>

    <div
      id="discountGrid"
      class="productGrid"
    ></div>
