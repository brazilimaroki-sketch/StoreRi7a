<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3ea8">
<title>StoreRi7a</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="siteHeader">
  <div class="topBar">
    <a class="brandLogo" href="/" aria-label="StoreRi7a">
      <img src="ri7a-logo.png" alt="RI7A">
    </a>

    <div class="searchBox">
      <span>⌕</span>
      <input id="searchTop" type="search" placeholder="ابحث داخل القسم..." oninput="searchAll(this.value)">
    </div>

    <button class="cartTop" type="button" onclick="openCart()" aria-label="السلة">
      🛒 <b id="cartCount">0</b>
    </button>
  </div>

  <nav class="mainNav" aria-label="الأقسام الرئيسية">
    <a href="/">⌂ الرئيسية</a>
    <a data-cat="women" href="category.html?cat=women">♀ عطور نسائية</a>
    <a data-cat="men" href="category.html?cat=men">♂ عطور رجالية</a>
    <a data-cat="beauty" href="category.html?cat=beauty">▣ مواد التجميل</a>
  </nav>
</header>

<main class="page">
  <section class="section firstSection categoryPageSection">
    <div class="sectionTitle">
      <div>
        <span id="categoryEyebrow" class="eyebrow">STORE RI7A</span>
        <h2 id="categoryTitle">المنتجات</h2>
        <p id="categorySubtitle"></p>
      </div>
      <a href="/">العودة للرئيسية</a>
    </div>

    <div id="categoryGrid" class="productGrid"></div>
    <div id="categoryEmpty" class="empty" style="display:none">لا توجد منتجات في هذا القسم حالياً.</div>
  </section>
</main>

<footer>
  <a href="/" aria-label="العودة للرئيسية"><img src="ri7a-logo.png" alt="RI7A"></a>
  <h3>StoreRi7a</h3>
  <p>عطور للرجال والنساء • جمال • أناقة</p>
  <small>© 2026 StoreRi7a</small>
</footer>

<div id="cartShade" class="cartShade" onclick="closeCart()"></div>
<aside id="cart" class="cartDrawer">
  <div class="cartHead"><h2>سلة المشتريات</h2><button type="button" onclick="closeCart()">✕</button></div>
  <div id="cartItems"></div>
  <div class="cartTotal"><span>المجموع</span><b id="total">0 DH</b></div>
  <button class="waBtn" type="button" onclick="checkout()">إرسال الطلب عبر WhatsApp</button>
</aside>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
