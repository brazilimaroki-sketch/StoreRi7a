<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة StoreRi7a</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f8fc;font-family:Arial,Tahoma,sans-serif;color:#172033}
.wrap{max-width:950px;margin:auto;padding:18px}
h1{color:#16489d}
.card{background:#fff;border:1px solid #dfe6f2;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 8px 25px #163a7210}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;font-size:13px;color:#667085;margin:4px 0}
input,select,textarea{width:100%;border:1px solid #d6dfed;border-radius:12px;padding:0 12px;font-size:15px;background:#fff}
input,select{height:46px}
textarea{min-height:110px;padding:12px;resize:vertical;font-family:inherit}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
.primary{background:#174ea6;color:#fff}
.secondary{background:#eef3fb;color:#17427d}
.danger{background:#ffebef;color:#b10032}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.msg{padding:10px;border-radius:10px;margin-top:10px;display:none}
.ok{background:#e8fff0;color:#08752f;display:block}
.err{background:#ffecee;color:#a60021;display:block}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;border-top:1px solid #eee;padding:14px 0}
.item:first-child{border-top:0}
.meta{font-size:13px;color:#7a8494;margin-top:5px;line-height:1.6}
.sale{color:#d71920;font-weight:800}
small.hint{display:block;color:#8d95a3;margin-top:5px}
.typeSwitch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.typeSwitch button.active{background:#174ea6;color:#fff}
.preview{margin-top:10px;border:1px solid #e0e6ef;border-radius:14px;padding:10px;display:none}
.preview img{max-width:220px;max-height:220px;border-radius:12px;display:block;margin:auto}
.uploadStatus{font-size:13px;color:#667085;margin-top:8px}
.full{grid-column:1/-1}
@media(max-width:650px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
  <h1>لوحة إدارة StoreRi7a</h1>

  <div class="card">
    <h3>مفتاح الإدارة</h3>
    <label>ADMIN_KEY</label>
    <input id="adminKey" type="password" placeholder="أدخل نفس ADMIN_KEY الموجود في Cloudflare">
    <div class="actions">
      <button class="secondary" onclick="saveKey()">حفظ المفتاح</button>
      <button class="secondary" onclick="loadProducts()">تحديث المنتجات</button>
    </div>
  </div>

  <div class="card">
    <h3 id="formTitle">إضافة منتج</h3>

    <div class="typeSwitch">
      <button id="normalBtn" class="secondary active" type="button" onclick="setProductType(false)">منتج بدون تخفيض</button>
      <button id="saleBtn" class="secondary" type="button" onclick="setProductType(true)">منتج بتخفيض</button>
    </div>

    <div class="grid">
      <div>
        <label>اسم المنتج</label>
        <input id="productName" placeholder="مثال: Rose Velvet">
      </div>

      <div>
        <label>القسم</label>
        <select id="productCategory">
          <option value="عطور نسائية">عطور نسائية</option>
          <option value="عطور رجالية">عطور رجالية</option>
          <option value="مواد التجميل">مواد التجميل</option>
        </select>
      </div>

      <div>
        <label>الماركة</label>
        <input id="productBrand" placeholder="مثال: Lattafa">
      </div>

      <div>
        <label>الحجم / السعة</label>
        <input id="productSize" placeholder="مثال: 50 ml أو 100 ml">
      </div>

      <div>
        <label>السعر العادي (DH)</label>
        <input id="productPrice" type="number" min="0" step="0.01" placeholder="199">
      </div>

      <div id="salePriceWrap" style="display:none">
        <label>سعر التخفيض</label>
        <input id="productSalePrice" type="number" min="0" step="0.01" placeholder="149" oninput="syncDiscount()">
      </div>

      <div id="discountWrap" style="display:none">
        <label>نسبة التخفيض %</label>
        <input id="productDiscount" type="number" min="0" max="100" step="1" placeholder="25" oninput="syncSalePrice()">
      </div>

      <div class="full">
        <label>وصف المنتج</label>
        <textarea id="productDescription" placeholder="اكتب وصفاً مختصراً للمنتج، الرائحة، المميزات، الاستعمال..."></textarea>
      </div>

      <div class="full">
        <label>صورة المنتج من الهاتف أو الحاسوب</label>
        <input id="productImageFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewImage()">
        <small class="hint">JPEG / PNG / WebP — الحد الأقصى 5 MB.</small>
        <div id="preview" class="preview"><img id="previewImg" alt=""></div>
        <div id="uploadStatus" class="uploadStatus"></div>
        <input id="productImage" type="hidden">
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="saveBtn" onclick="saveProduct()">إضافة المنتج</button>
      <button class="secondary" id="cancelBtn" onclick="resetForm()" style="display:none">إلغاء التعديل</button>
    </div>

    <div id="message" class="msg"></div>
  </div>

  <div class="card">
    <h3>المنتجات الحالية</h3>
    <div id="productList">جاري التحميل...</div>
  </div>
</div>

<script>
let editingId=null;
let products=[];
let saleMode=false;

const $=id=>document.getElementById(id);

function key(){
  return localStorage.getItem('storeri7a_admin_key') || $('adminKey').value.trim();
}

function saveKey(){
  localStorage.setItem('storeri7a_admin_key',$('adminKey').value.trim());
  show('✅ تم حفظ المفتاح','ok');
  loadProducts();
}

function show(text,type='ok'){
  const m=$('message');
  m.textContent=text;
  m.className='msg '+type;
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function setProductType(isSale){
  saleMode=!!isSale;
  $('normalBtn').classList.toggle('active',!saleMode);
  $('saleBtn').classList.toggle('active',saleMode);
  $('salePriceWrap').style.display=saleMode?'block':'none';
  $('discountWrap').style.display=saleMode?'block':'none';

  if(!saleMode){
    $('productSalePrice').value='';
    $('productDiscount').value='';
  }
}

function syncDiscount(){
  const price=Number($('productPrice').value||0);
  const sale=Number($('productSalePrice').value||0);

  if(price>0 && sale>0 && sale<price){
    $('productDiscount').value=Math.round((1-sale/price)*100);
  }
}

function syncSalePrice(){
  const price=Number($('productPrice').value||0);
  const disc=Number($('productDiscount').value||0);

  if(price>0 && disc>0 && disc<100){
    $('productSalePrice').value=(price*(1-disc/100)).toFixed(2).replace(/\.00$/,'');
  }
}

function previewImage(){
  const file=$('productImageFile').files[0];
  if(!file) return;

  const img=$('previewImg');
  img.src=URL.createObjectURL(file);
  $('preview').style.display='block';
  $('uploadStatus').textContent='الصورة جاهزة للرفع.';
}

async function uploadSelectedImage(){
  const file=$('productImageFile').files[0];

  if(!file){
    return $('productImage').value.trim();
  }

  $('uploadStatus').textContent='جاري رفع الصورة...';

  const form=new FormData();
  form.append('image',file);

  const r=await fetch('/api/upload-image',{
    method:'POST',
    headers:{'x-admin-key':key()},
    body:form
  });

  const text=await r.text();

  if(!r.ok){
    throw new Error(text || ('HTTP '+r.status));
  }

  const data=JSON.parse(text);
  if(!data.url) throw new Error('لم يتم إرجاع رابط الصورة');

  $('productImage').value=data.url;
  $('uploadStatus').textContent='✅ تم رفع الصورة بنجاح';

  return data.url;
}

async function loadProducts(){
  $('adminKey').value=localStorage.getItem('storeri7a_admin_key')||'';

  try{
    const r=await fetch('/api/products?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);

    products=await r.json();
    renderProducts();
  }catch(e){
    $('productList').textContent='تعذر تحميل المنتجات: '+e.message;
  }
}

function renderProducts(){
  if(!products.length){
    $('productList').innerHTML='<p>لا توجد منتجات بعد.</p>';
    return;
  }

  $('productList').innerHTML=products.map(p=>{
    const sale=(p.sale_price!==null && p.sale_price!==undefined && Number(p.sale_price)<Number(p.price))
      ? `<span class="sale"> → ${p.sale_price} DH (-${p.discount||Math.round((1-p.sale_price/p.price)*100)}%)</span>`
      : '';

    const extra=[
      p.brand ? 'الماركة: '+esc(p.brand) : '',
      p.size ? 'الحجم: '+esc(p.size) : ''
    ].filter(Boolean).join(' — ');

    return `<div class="item">
      <div>
        <b>${esc(p.name)}</b>
        <div class="meta">${esc(p.category)} — ${p.price} DH ${sale}</div>
        ${extra?`<div class="meta">${extra}</div>`:''}
        <div class="meta">${p.image?'✅ عنده صورة':'بدون صورة'}</div>
      </div>

      <div class="actions">
        <button class="secondary" onclick="editProduct(${Number(p.id)})">تعديل</button>
        <button class="danger" onclick="deleteProduct(${Number(p.id)})">حذف</button>
      </div>
    </div>`;
  }).join('');
}

function editProduct(id){
  const p=products.find(x=>Number(x.id)===Number(id));
  if(!p) return;

  editingId=id;

  $('formTitle').textContent='تعديل المنتج';
  $('saveBtn').textContent='حفظ التعديل';
  $('cancelBtn').style.display='inline-block';

  $('productName').value=p.name||'';
  $('productCategory').value=
    p.category==='تجميل' ? 'مواد التجميل' : (p.category||'عطور نسائية');

  $('productBrand').value=p.brand||'';
  $('productSize').value=p.size||'';
  $('productDescription').value=p.description||'';
  $('productPrice').value=p.price??'';
  $('productSalePrice').value=p.sale_price??'';
  $('productDiscount').value=p.discount??'';
  $('productImage').value=p.image||'';
  $('productImageFile').value='';

  setProductType(
    p.sale_price!==null &&
    p.sale_price!==undefined &&
    Number(p.sale_price)<Number(p.price)
  );

  if(p.image){
    $('previewImg').src=p.image;
    $('preview').style.display='block';
  }else{
    $('preview').style.display='none';
  }

  $('uploadStatus').textContent='';

  window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
  editingId=null;

  $('formTitle').textContent='إضافة منتج';
  $('saveBtn').textContent='إضافة المنتج';
  $('cancelBtn').style.display='none';

  $('productName').value='';
  $('productBrand').value='';
  $('productSize').value='';
  $('productDescription').value='';
  $('productPrice').value='';
  $('productSalePrice').value='';
  $('productDiscount').value='';
  $('productImage').value='';
  $('productImageFile').value='';
  $('productCategory').value='عطور نسائية';

  $('preview').style.display='none';
  $('uploadStatus').textContent='';

  setProductType(false);
}

async function saveProduct(){
  try{
    const imageUrl=await uploadSelectedImage();

    const payload={
      name:$('productName').value.trim(),
      category:$('productCategory').value,
      brand:$('productBrand').value.trim(),
      size:$('productSize').value.trim(),
      description:$('productDescription').value.trim(),
      price:Number($('productPrice').value),
      sale_price:saleMode && $('productSalePrice').value!=='' ? Number($('productSalePrice').value) : null,
      discount:saleMode && $('productDiscount').value!=='' ? Number($('productDiscount').value) : 0,
      image:imageUrl,
      active:1
    };

    if(!payload.name || !payload.category || !Number.isFinite(payload.price) || payload.price<0){
      show('❌ أدخل الاسم والقسم والسعر بشكل صحيح','err');
      return;
    }

    if(payload.sale_price!==null && (payload.sale_price<0 || payload.sale_price>=payload.price)){
      show('❌ سعر التخفيض يجب أن يكون أقل من السعر العادي','err');
      return;
    }

    const url=editingId ? '/api/products/'+editingId : '/api/products';
    const method=editingId ? 'PUT' : 'POST';

    const r=await fetch(url,{
      method,
      headers:{
        'content-type':'application/json',
        'x-admin-key':key()
      },
      body:JSON.stringify(payload)
    });

    const text=await r.text();

    if(!r.ok){
      throw new Error(text || ('HTTP '+r.status));
    }

    show(editingId?'✅ تم تعديل المنتج بنجاح':'✅ تمت إضافة المنتج بنجاح','ok');

    resetForm();
    await loadProducts();

  }catch(e){
    show('❌ '+e.message,'err');
  }
}

async function deleteProduct(id){
  if(!confirm('هل تريد حذف هذا المنتج؟')) return;

  try{
    const r=await fetch('/api/products/'+id,{
      method:'DELETE',
      headers:{'x-admin-key':key()}
    });

    const text=await r.text();

    if(!r.ok){
      throw new Error(text || ('HTTP '+r.status));
    }

    show('✅ تم حذف المنتج','ok');
    await loadProducts();

  }catch(e){
    show('❌ '+e.message,'err');
  }
}

setProductType(false);
loadProducts();
</script>
</body>
</html>
